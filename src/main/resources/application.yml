spring:
  application:
    name: PasswordsManager
server:
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
jwt:
  public:
    key: classpath:public_key.pem
  private:
    key: classpath:private_key.pem
